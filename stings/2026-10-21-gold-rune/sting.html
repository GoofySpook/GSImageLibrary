<!doctype html>
<html><head><meta charset="utf-8">
<!--
  GS Grimoire MOTION STING template (Codex look): a 4-8 s brand intro or outro.
  Same contract as the reel: window.DURATION, window.seek(t), window.ready, window.HITS.
  Laid out at 360x640 CSS px, shot at 3x. The ember canvas stays 1080x1920 internally.
  Edit the title, subline and the HIT time; keep the hit, the rule and the subline
  in that order so the eye has one thing to look at at a time.
-->
<style>
@font-face{font-family:Cinzel;font-weight:600;src:url(fonts/Cinzel600.woff2)}
@font-face{font-family:Fell;font-style:italic;src:url(fonts/FellItalic.woff2)}
:root{--gold:#c8a84b;--gold-hi:#f1dc9a;--ink:#0b0907}
html,body{margin:0;width:360px;height:640px;background:var(--ink);overflow:hidden}
#stage{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 46%,#2a1f12 0%,#120d08 55%,var(--ink) 100%)}
canvas{position:absolute;inset:0}
#rig{position:absolute;inset:0;transform-origin:50% 46%}
#rune{position:absolute;left:50%;top:46%;width:286.67px;height:286.67px;margin:-143.33px 0 0 -143.33px}
#rune *{fill:none;stroke:var(--gold);stroke-linecap:round}
#title{position:absolute;left:0;right:0;top:calc(46% - 46.67px);text-align:center;font:600 36.0px/1.05 Cinzel,serif;color:var(--gold-hi);letter-spacing:2.0px;text-shadow:0 0 13.33px rgba(200,168,75,.45)}
#title .l{display:inline-block}
#rule{position:absolute;left:50%;top:calc(46% + 38.67px);width:186.67px;height:1.0px;margin-left:-93.33px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#sub{position:absolute;left:0;right:0;top:calc(46% + 46.67px);text-align:center;font:italic 19.33px Fell,serif;color:#e9dcc0}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,236,180,.9),rgba(255,236,180,0) 55%);opacity:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style></head><body>
<div id="stage"></div>
<canvas id="embers" width="1080" height="1920" style="width:360px;height:640px"></canvas>
<div id="rig">
  <svg id="rune" viewBox="-430 -430 860 860">
    <circle id="c1" r="400" stroke-width="3"/>
    <circle id="c2" r="372" stroke-width="1.5" opacity=".6"/>
    <polygon id="p1" points="0,-372 322,186 -322,186" stroke-width="2" opacity=".5"/>
    <polygon id="p2" points="0,372 322,-186 -322,-186" stroke-width="2" opacity=".5"/>
  </svg>
  <div id="title">GS<br>GRIMOIRE</div>
  <div id="rule"></div>
  <div id="sub">The Archive is open</div>
</div>
<div id="flash"></div>
<div id="black"></div>
<script src="lib/gsap.min.js"></script>
<script>
const DUR=6, HIT=2.35;   // the light hit; move it onto a beat when there is a track. Title lands ~1.2s before it
// Split title into letters
const T=document.getElementById('title');
T.innerHTML=T.innerHTML.split('<br>').map(w=>[...w].map(c=>`<span class="l">${c}</span>`).join('')).join('<br>');

// Prepare stroke-draw for SVG shapes
document.querySelectorAll('#rune circle, #rune polygon').forEach(el=>{
  const L=el.getTotalLength(); el.style.strokeDasharray=L; el.style.strokeDashoffset=L;
});

const tl=gsap.timeline({paused:true});
tl.to('#c1',{strokeDashoffset:0,duration:1.4,ease:'power2.inOut'},0.1)
  .to('#c2',{strokeDashoffset:0,duration:1.4,ease:'power2.inOut'},0.3)
  .to(['#p1','#p2'],{strokeDashoffset:0,duration:1.0,ease:'power1.inOut',stagger:.15},0.7)
  .to('#rune',{rotation:30,duration:6,ease:'none'},0)
  .from('#title .l',{opacity:0,y:20,filter:'blur(5px)',duration:.7,ease:'power3.out',stagger:.07},HIT-1.15)
  .fromTo('#flash',{opacity:0},{opacity:.85,duration:.08,ease:'none'},HIT)
  .to('#flash',{opacity:0,duration:.6,ease:'power2.out'},HIT+.08)
  .fromTo('#rune',{scale:1},{scale:1.06,duration:.12,yoyo:true,repeat:1,ease:'power2.out'},HIT)
  .from('#rule',{scaleX:0,duration:.7,ease:'power3.out'},HIT+.25)
  .from('#sub',{opacity:0,y:7,letterSpacing:'4px',duration:.9,ease:'power2.out'},HIT+.5)
  .fromTo('#rig',{scale:1},{scale:1.05,duration:6,ease:'none'},0)
  .to('#black',{opacity:1,duration:.7,ease:'power1.in'},DUR-.7);

// Deterministic embers: positions are a pure function of t
const cv=document.getElementById('embers'),cx=cv.getContext('2d');
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
const P=[...Array(110)].map(()=>({x:rnd()*1080,y:rnd()*1920,v:60+rnd()*160,r:1+rnd()*3.2,ph:rnd()*6.28,sw:10+rnd()*30}));
function embers(t){
  cx.clearRect(0,0,1080,1920);
  for(const p of P){
    const y=((p.y-p.v*t)%1920+1920)%1920, x=p.x+Math.sin(t*1.3+p.ph)*p.sw;
    const a=.25+.55*Math.abs(Math.sin(t*2+p.ph));
    const g=cx.createRadialGradient(x,y,0,x,y,p.r*4);
    g.addColorStop(0,`rgba(255,214,140,${a})`);g.addColorStop(1,'rgba(255,170,60,0)');
    cx.fillStyle=g;cx.beginPath();cx.arc(x,y,p.r*4,0,6.29);cx.fill();
  }
}
window.DURATION=DUR; window.HITS=[HIT];
window.seek=t=>{tl.seek(t,false);embers(t);};
window.ready=document.fonts.ready.then(()=>{window.seek(0);return true;});
</script></body></html>
